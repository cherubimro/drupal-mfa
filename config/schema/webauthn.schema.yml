webauthn.settings:
  type: config_object
  label: 'WebAuthn settings'
  mapping:
    policy:
      type: string
      label: '2FA policy'
    verification_mode:
      type: string
      label: 'Verification mode: any single method or all configured methods'
    rp_name:
      type: string
      label: 'Relying Party name'
    rp_id:
      type: string
      label: 'Relying Party ID (domain)'
    timeout:
      type: integer
      label: 'Ceremony timeout in milliseconds'
    user_verification:
      type: string
      label: 'User verification requirement'
    attestation:
      type: string
      label: 'Attestation conveyance preference'
    attachment:
      type: string
      label: 'Authenticator attachment preference'
